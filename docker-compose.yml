services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-isoko}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-isoko}
      POSTGRES_DB: ${DB_NAME:-isoko_talents_dev}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-isoko} -d ${DB_NAME:-isoko_talents_dev}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-isoko}
      DB_PASSWORD: ${DB_PASSWORD:-isoko}
      DB_NAME: ${DB_NAME:-isoko_talents_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - '4000:4000'
    volumes:
      - ./server:/app
      - /app/node_modules
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  client:
    build: ./client
    restart: unless-stopped
    environment:
      # Browser calls same origin; Vite proxies /api to the server container.
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://server:4000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  server_uploads:
