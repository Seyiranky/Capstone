name: CI

# NFR-5: automated tests run on every commit before any deployment build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: isoko
          POSTGRES_PASSWORD: isoko
          POSTGRES_DB: isoko_talents_test
        ports: ['5432:5432']
        # Without this the first migration can race the database accepting
        # connections, which fails intermittently rather than honestly.
        options: >-
          --health-cmd "pg_isready -U isoko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: isoko
      DB_PASSWORD: isoko
      DB_NAME: isoko_talents_test
      DB_NAME_TEST: isoko_talents_test
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 7d
      PASSPORT_SIGNING_SECRET: ci-passport-secret

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npx eslint .

      - name: Typecheck
        # Jest runs ts-jest with diagnostics off, so this is the only thing
        # standing between a type error and a green build. Without it the
        # migration to TypeScript would buy nothing in CI.
        run: npm run typecheck

      - name: Migrate test database
        run: npm run migrate:test

      - name: Seed skill categories
        # The suite reads real Skill rows rather than inventing them, so an
        # unseeded database fails in a way that looks like broken code.
        run: npm run seed:test

      - run: npm test

      - name: Build
        # Proves the artifact `npm start` runs actually compiles, which the
        # tests do not: ts-jest transpiles the sources itself and never emits.
        run: npm run build

  client:
    name: Client (lint + typecheck + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit -p tsconfig.app.json
      # The offline queue decides what may be replayed after a gap in
      # connectivity. Getting that wrong duplicates a worker's actions, so it
      # is covered and gated like server logic.
      - run: npm test
      - run: npm run build

  image:
    # The proposal's pipeline "builds and publishes container images": the
    # production API image, built from server/Dockerfile.prod once the server
    # job has passed, and pushed to GitHub's registry from main only.
    name: Production image
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase; the owner's name ("Seyiranky") is not.
      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile.prod
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/isoko-api:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/isoko-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  i18n:
    name: Translations and shared code stay in step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check locale key parity
        # NFR-1 promises a bilingual interface. A key added to one locale and
        # not the other silently ships English to Kinyarwanda users, which no
        # other check would catch.
        run: node scripts/check-i18n-parity.mjs
      - name: Check copied code stays identical
        # The sensitive-gig keyword check is copied between server and client;
        # the server decides, the client previews. A change to one alone would
        # tell a client one thing and enforce another.
        run: node scripts/check-shared-copies.mjs
